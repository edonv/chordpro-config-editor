<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title></title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="">
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/jedison@latest/dist/umd/jedison.umd.js"></script>

    <div id="jedison-container"></div>

    <script>
        /**
         * @returns {Promise<string | undefined>}
         */
        async function getChordProSchema() {
            const schemaStoreResp = await fetch('https://www.schemastore.org/api/json/catalog.json');
            const schemaStoreJSON = await schemaStoreResp.json();

            const chordProSchemaInfo = schemaStoreJSON.schemas.find(schema => schema.name.toLowerCase().includes('chordpro'));
            const chordProSchemaURL = chordProSchemaInfo?.url;

            if (!chordProSchemaURL) {
                return;
            }

            const chordProSchemaResp = await fetch(chordProSchemaURL);
            const chordProSchema = await chordProSchemaResp.json();

            // console.log(chordProSchema);
            return chordProSchema;
        }

        const jedison = new Jedison.Create({
            container: document.querySelector('#jedison-container'),
            theme: new Jedison.Theme(),
            schema: await getChordProSchema(),
        });
    </script>

</body>

</html>
